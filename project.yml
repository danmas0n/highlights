name: Highlights
options:
  bundleIdPrefix: com.danmason
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: WF2V683SH3
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The capture path deliberately spans three isolation domains (main actor for UI, a serial
    # queue for the writer, an actor for the store). Keep the compiler checking that.
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Highlights:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Highlights
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # Declared up front so every submission isn't stopped to ask. The app uses no encryption
        # beyond what iOS itself provides, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarHidden: true
        NSCameraUsageDescription: >-
          Highlights uses the camera to record the game so you can save the
          moments you mark. Nothing leaves your phone.
        NSMicrophoneUsageDescription: >-
          Highlights records audio alongside video so your saved clips have
          crowd and sideline sound.
        NSPhotoLibraryAddUsageDescription: >-
          Highlights saves the clips you export to your photo library.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danmason.highlights
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Generate a shared scheme explicitly; the one Xcode auto-creates resolves to no buildable
    # platforms and breaks `-destination` selection.
    scheme:
      build:
        targets:
          Highlights: all
